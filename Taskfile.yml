version: "3"

tasks:
  install:
    desc: Install xlflow to local environment
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' install ./cmd/xlflow
        platforms: [windows]
      - cmd: go install ./cmd/xlflow
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\build-dotnet-bridge.ps1' -InstallToGoBin
        platforms: [windows]

  uninstall:
    desc: Remove xlflow and the Excel bridge from the local Go bin directory
    cmds:
      - |
        powershell -NoProfile -ExecutionPolicy Bypass -Command '
        $ErrorActionPreference = "Stop"
        $goBin = (go env GOBIN).Trim()
        if ([string]::IsNullOrWhiteSpace($goBin)) {
          $goPath = (go env GOPATH).Trim()
          if ([string]::IsNullOrWhiteSpace($goPath)) {
            throw "Unable to resolve GOBIN/GOPATH from go env."
          }
          $goBin = Join-Path ($goPath.Split([IO.Path]::PathSeparator)[0]) "bin"
        }
        foreach ($name in @("xlflow.exe", "xlflow-excel-bridge.exe")) {
          $path = Join-Path $goBin $name
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Force
            Write-Output ("Removed " + $path)
          } else {
            Write-Output ("Not found: " + $path)
          }
        }
        '

  wsl-install:
    desc: Install the xlflow frontend binary into the current WSL environment
    cmds:
      - go install ./cmd/xlflow
      - |
        bin="$(go env GOBIN)"
        if [ -z "$bin" ]; then
          bin="$(go env GOPATH | cut -d: -f1)/bin"
        fi
        printf "Installed xlflow to %s/xlflow\n" "$bin"
        if ! command -v xlflow >/dev/null 2>&1; then
          printf "Warning: xlflow is not on PATH inside WSL. Add %s to PATH.\n" "$bin"
        fi

  wsl-uninstall:
    desc: Remove the xlflow frontend binary from the current WSL Go bin directory
    cmds:
      - |
        bin="$(go env GOBIN)"
        if [ -z "$bin" ]; then
          bin="$(go env GOPATH | cut -d: -f1)/bin"
        fi
        target="$bin/xlflow"
        if [ -e "$target" ]; then
          rm -f "$target"
          printf "Removed %s\n" "$target"
        else
          printf "Not found: %s\n" "$target"
        fi

  run:
    desc: Run xlflow without install
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' run ./cmd/xlflow {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: go run ./cmd/xlflow {{.CLI_ARGS}}
        platforms: [linux, darwin]

  doctor:
    cmds:
      - task run -- doctor

  xlflow-lint:
    desc: Run xlflow lint without install
    cmds:
      - task run -- lint

  ps-lint:
    desc: Run PSScriptAnalyzer for tracked PowerShell sources
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\lint-powershell.ps1'

  lint:
    desc: Run repository linters
    cmds:
      - golangci-lint run
      - task ps-lint
      - pnpm lint
      - pnpm docs:check

  test:
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./...
        platforms: [windows]
      - cmd: go test ./...
        platforms: [linux, darwin]

  corpus:update-snapshots:
    desc: Update real-world corpus snapshots
    env:
      XLFLOW_RUN_REALWORLD_CORPUS: "1"
      XLFLOW_UPDATE_CORPUS_SNAPSHOTS: "1"
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^TestRealWorldCorpusSnapshots$' -count=1
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^TestRealWorldCorpusSnapshots$' -count=1
        platforms: [linux, darwin]

  corpus:test:
    desc: Run real-world corpus snapshot tests without updating snapshots
    env:
      XLFLOW_RUN_REALWORLD_CORPUS: "1"
      XLFLOW_UPDATE_CORPUS_SNAPSHOTS: "0"
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^TestRealWorldCorpusSnapshots$' -count=1 --test.v
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^TestRealWorldCorpusSnapshots$' -count=1 -v
        platforms: [linux, darwin]

  corpus:metrics:
    desc: Verify committed real-world corpus reviews and print reviewed-only precision metrics
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^TestCommittedCorpusReviewMetrics$' -count=1 --test.v
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^TestCommittedCorpusReviewMetrics$' -count=1 -v
        platforms: [linux, darwin]

  corpus:review-candidates:
    desc: "List unreviewed committed snapshot diagnostics for one rule (usage: task corpus:review-candidates -- VBA225 [20])"
    env:
      XLFLOW_PRINT_CORPUS_REVIEW_CANDIDATES: "1"
      XLFLOW_CORPUS_REVIEW_CANDIDATES_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^TestCommittedCorpusReviewCandidates$' -count=1 --test.v
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^TestCommittedCorpusReviewCandidates$' -count=1 -v
        platforms: [linux, darwin]

  corpus:review-details:
    desc: "Run selected corpus projects and print exact review ranges (usage: rtk proxy task corpus:review-details -- --rule VBA225 [--limit 20] [--project third_party/std-vba])"
    silent: true
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' run ./cmd/xlflow-static-analysis-corpus review-details {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: go run ./cmd/xlflow-static-analysis-corpus review-details {{.CLI_ARGS}}
        platforms: [linux, darwin]

  corpus:review-draft:
    desc: "Print schema-valid review JSONL without editing the ledger (invoke through rtk proxy task to preserve complete output)"
    silent: true
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' run ./cmd/xlflow-static-analysis-corpus review-draft {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: go run ./cmd/xlflow-static-analysis-corpus review-draft {{.CLI_ARGS}}
        platforms: [linux, darwin]

  corpus:test-focused:
    desc: "Read-only focused corpus verification (usage: task corpus:test-focused -- --project third_party/std-vba --rule VBA225)"
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' run ./cmd/xlflow-static-analysis-corpus verify {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: rtk go run ./cmd/xlflow-static-analysis-corpus verify {{.CLI_ARGS}}
        platforms: [linux, darwin]

  bench:lsp:
    desc: Run deterministic LSP performance benchmarks
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/lspserver -run '^TestLSPBenchmarkFixture$' -bench '^BenchmarkLSP' -benchmem -benchtime=1x -count 5 -timeout 25m
        platforms: [windows]
      - cmd: rtk proxy go test ./internal/lspserver -run '^TestLSPBenchmarkFixture$' -bench '^BenchmarkLSP' -benchmem -benchtime=1x -count 5 -timeout 25m
        platforms: [linux, darwin]

  bench:lsp-startup:
    desc: Run the deterministic LSP startup/readiness benchmark
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/lspserver -run '^TestLSPStartupBenchmarkFixture$' -bench '^BenchmarkLSPStartup$' -benchmem -benchtime=1x -count 5
        platforms: [windows]
      - cmd: rtk proxy go test ./internal/lspserver -run '^TestLSPStartupBenchmarkFixture$' -bench '^BenchmarkLSPStartup$' -benchmem -benchtime=1x -count 5
        platforms: [linux, darwin]

  bench:corpus:
    desc: Benchmark the analyzer stage for the slowest real-world corpus projects
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^$' -bench '^BenchmarkRealWorldCorpus/(std-vba|ronecone)/analyze-only/(cold|warm|local-edit|dependency-edit)$' -benchmem -benchtime=1x -count 2
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^$' -bench '^BenchmarkRealWorldCorpus/(std-vba|ronecone)/analyze-only/(cold|warm|local-edit|dependency-edit)$' -benchmem -benchtime=1x -count 2
        platforms: [linux, darwin]

  bench:corpus-semantic-query:
    desc: Collect serial cold/warm/edit semantic-query benchmark samples for the corpus
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^$' -bench '^BenchmarkRealWorldCorpus/(std-vba|ronecone)/analyze-only/(cold|warm|local-edit|dependency-edit)$' -benchmem -benchtime=1x -count 10
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^$' -bench '^BenchmarkRealWorldCorpus/(std-vba|ronecone)/analyze-only/(cold|warm|local-edit|dependency-edit)$' -benchmem -benchtime=1x -count 10
        platforms: [linux, darwin]

  bench:corpus-ronecone:
    desc: Collect ten-sample ROneCOne analyzer stress-fixture measurements
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/staticanalysis/corpus -run '^$' -bench '^BenchmarkRealWorldCorpus/ronecone/analyze-only/(cold|warm|local-edit|dependency-edit)$' -benchmem -benchtime=1x -count 10 -timeout=25m
        platforms: [windows]
      - cmd: rtk go test ./internal/staticanalysis/corpus -run '^$' -bench '^BenchmarkRealWorldCorpus/ronecone/analyze-only/(cold|warm|local-edit|dependency-edit)$' -benchmem -benchtime=1x -count 10 -timeout=25m
        platforms: [linux, darwin]

  bench:analyze:
    desc: Benchmark synthetic batch analysis scaling and object worklist metrics
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/analyze -run '^TestSyntheticBenchmarkFixtureScale$' -bench '^Benchmark(SyntheticProject|ObjectAnalysisWorklist)$' -benchmem -benchtime=1x -count 1
        platforms: [windows]
      - cmd: rtk go test ./internal/analyze -run '^TestSyntheticBenchmarkFixtureScale$' -bench '^Benchmark(SyntheticProject|ObjectAnalysisWorklist)$' -benchmem -benchtime=1x -count 1
        platforms: [linux, darwin]

  bench:analyze-single-module:
    desc: Benchmark deterministic large single-module analyzer workloads
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/analyze -run '^TestSingleModuleBenchmarkFixtureScale$' -bench '^BenchmarkSingleModuleSynthetic$' -benchmem -benchtime=1x -count 1
        platforms: [windows]
      - cmd: rtk go test ./internal/analyze -run '^TestSingleModuleBenchmarkFixtureScale$' -bench '^BenchmarkSingleModuleSynthetic$' -benchmem -benchtime=1x -count 1
        platforms: [linux, darwin]

  bench:callgraph-cycles:
    desc: Compare exhaustive and bounded procedure-cycle detection
    cmds:
      - cmd: rtk powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' test ./internal/vba/callgraph -run '^$' -bench '^BenchmarkCycleDetection$' -benchmem -benchtime=1x -count 5
        platforms: [windows]
      - cmd: rtk go test ./internal/vba/callgraph -run '^$' -bench '^BenchmarkCycleDetection$' -benchmem -benchtime=1x -count 5
        platforms: [linux, darwin]

  verify:security:
    desc: Run vulnerability and third-party licence inventory checks
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' run golang.org/x/vuln/cmd/govulncheck@latest ./...
        platforms: [windows]
      - cmd: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\check-third-party-licences.ps1'
        platforms: [windows]

  verify:
    desc: Fast local verification (non-COM)
    cmds:
      - task test

  fmt:
    parallel: true
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' fmt ./...
        platforms: [windows]
      - cmd: go fmt ./...
        platforms: [linux, darwin]
      - pnpm run format
      - dotnet format bridge/dotnet/Xlflow.ExcelBridge.sln

  tidy:
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File '.\scripts\dev\go.ps1' mod tidy
        platforms: [windows]
      - cmd: go mod tidy
        platforms: [linux, darwin]

  review:codex:
    desc: Run quiet Codex review against origin/main
    env:
      XLFLOW_CODEX_REVIEW_ARGS_JSON: '{{.CLI_ARGS_LIST | toJson}}'
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev/codex-review-task.ps1
        platforms: [windows]

  test:codex-review:
    desc: Run Codex review launcher argument regression tests
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/dev/test-codex-review.ps1
        platforms: [windows]
